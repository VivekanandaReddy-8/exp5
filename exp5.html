<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - E-Commerce</title>
    <link rel="stylesheet" href="exp5.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <h2>ShopEasy</h2>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Offers</a>
            <a href="#">Contact</a>
        </div>

        <button class="cart">🛒 Cart</button>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div>
            <h1>Big Deals, Better Shopping!</h1>
            <p>Discover amazing products at the best prices.</p>
            <button class="shop-btn">Shop Now</button>
        </div>
    </section>

    <!-- Products Section -->
    <section class="products">
        <h2>Featured Products</h2>

        <div class="product-grid">

            <div class="product-card">
                <div class="product-img">👟</div>
                <h3>Sports Shoes</h3>
                <p>₹1,499</p>
                <button>Buy Now</button>
            </div>

            <div class="product-card">
                <div class="product-img">🎧</div>
                <h3>Headphones</h3>
                <p>₹999</p>
                <button>Buy Now</button>
            </div>

            <div class="product-card">
                <div class="product-img">⌚</div>
                <h3>Smart Watch</h3>
                <p>₹2,499</p>
                <button>Buy Now</button>
            </div>

            <div class="product-card">
                <div class="product-img">📱</div>
                <h3>Smart Phone</h3>
                <p>₹14,999</p>
                <button>Buy Now</button>
            </div>

        </div>
    </section>

    <footer>
        <p>© 2026 ShopEasy | All Rights Reserved</p>
    </footer>

</body>
</html>
